<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgAi' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#2e1065'/>
    </linearGradient>
    <linearGradient id='aiGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#a855f7'/>
      <stop offset='50%' stop-color='#ec4899'/>
      <stop offset='100%' stop-color='#ED1B2F'/>
    </linearGradient>
    <filter id='glowPurple' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>
  <rect width='400' height='240' rx='16' fill='url(#bgAi)'/>
  <circle cx='200' cy='120' r='90' fill='#a855f7' opacity='0.12' filter='url(#glowPurple)'/>
  <!-- Neural / AI Brain Lines -->
  <g stroke='url(#aiGrad)' stroke-width='2' opacity='0.6'>
    <line x1='120' y1='90' x2='200' y2='60'/>
    <line x1='280' y1='90' x2='200' y2='60'/>
    <line x1='120' y1='90' x2='160' y2='130'/>
    <line x1='280' y1='90' x2='240' y2='130'/>
    <line x1='160' y1='130' x2='200' y2='170'/>
    <line x1='240' y1='130' x2='200' y2='170'/>
    <line x1='160' y1='130' x2='240' y2='130'/>
  </g>
  <!-- Node Circles -->
  <circle cx='200' cy='60' r='12' fill='#3b82f6' filter='url(#glowPurple)'/>
  <circle cx='120' cy='90' r='10' fill='#a855f7'/>
  <circle cx='280' cy='90' r='10' fill='#ec4899'/>
  <circle cx='160' cy='130' r='14' fill='#8b5cf6'/>
  <circle cx='240' cy='130' r='14' fill='#f43f5e'/>
  <circle cx='200' cy='170' r='16' fill='#ED1B2F' filter='url(#glowPurple)'/>
  <!-- Central Sparkle -->
  <path d='M200,160 L203,167 L210,170 L203,173 L200,180 L197,173 L190,170 L197,167 Z' fill='#ffffff'/>
  <!-- Tech Floating Tags -->
  <g transform='translate(50, 45)'>
    <rect width='76' height='26' rx='8' fill='#1e1b4b' stroke='#8b5cf6' stroke-width='1'/>
    <text x='38' y='17' fill='#c084fc' font-family='sans-serif' font-size='10' font-weight='bold' text-anchor='middle'>Gemini AI</text>
  </g>
  <g transform='translate(275, 45)'>
    <rect width='76' height='26' rx='8' fill='#1e1b4b' stroke='#ec4899' stroke-width='1'/>
    <text x='38' y='17' fill='#f472b6' font-family='sans-serif' font-size='10' font-weight='bold' text-anchor='middle'>OpenAI</text>
  </g>
  <g transform='translate(145, 195)'>
    <rect width='110' height='26' rx='8' fill='#1e1b4b' stroke='#ED1B2F' stroke-width='1'/>
    <text x='55' y='17' fill='#fca5a5' font-family='sans-serif' font-size='10' font-weight='bold' text-anchor='middle'>Smart Agents</text>
  </g>
</svg>