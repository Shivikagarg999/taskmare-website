<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgAndroid' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#022c22'/>
    </linearGradient>
    <linearGradient id='neonGreen' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#3DDC84'/>
      <stop offset='100%' stop-color='#10B981'/>
    </linearGradient>
    <filter id='glowGreen' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>
  <rect width='400' height='240' rx='16' fill='url(#bgAndroid)'/>
  <circle cx='200' cy='120' r='90' fill='#3DDC84' opacity='0.08' filter='url(#glowGreen)'/>
  <rect x='130' y='30' width='140' height='180' rx='20' fill='#1e293b' stroke='#334155' stroke-width='2'/>
  <rect x='140' y='42' width='120' height='156' rx='12' fill='#0f172a'/>
  <!-- Top speaker -->
  <line x1='180' y1='36' x2='220' y2='36' stroke='#64748b' stroke-width='3' stroke-linecap='round'/>
  <!-- Android Robot Head -->
  <g transform='translate(170, 75) scale(0.6)'>
    <path d='M10,50 A40,40 0 0,1 90,50 Z' fill='url(#neonGreen)' filter='url(#glowGreen)'/>
    <line x1='30' y1='15' x2='18' y2='0' stroke='#3DDC84' stroke-width='4' stroke-linecap='round'/>
    <line x1='70' y1='15' x2='82' y2='0' stroke='#3DDC84' stroke-width='4' stroke-linecap='round'/>
    <circle cx='32' cy='36' r='4' fill='#0f172a'/>
    <circle cx='68' cy='36' r='4' fill='#0f172a'/>
  </g>
  <!-- UI Cards inside phone -->
  <rect x='150' y='125' width='100' height='28' rx='6' fill='#1e293b' stroke='#3DDC84' stroke-width='1' stroke-opacity='0.4'/>
  <rect x='158' y='132' width='50' height='6' rx='3' fill='#3DDC84'/>
  <rect x='158' y='142' width='30' height='4' rx='2' fill='#64748b'/>
  <circle cx='236' cy='139' r='6' fill='#3DDC84' opacity='0.8'/>
  <rect x='150' y='160' width='100' height='26' rx='6' fill='#1e293b'/>
  <rect x='158' y='167' width='60' height='5' rx='2.5' fill='#94a3b8'/>
  <!-- Tech Floating Tags -->
  <g transform='translate(50, 65)'>
    <rect width='70' height='26' rx='8' fill='#1e293b' stroke='#3DDC84' stroke-width='1'/>
    <text x='35' y='17' fill='#3DDC84' font-family='sans-serif' font-size='10' font-weight='bold' text-anchor='middle'>Kotlin</text>
  </g>
  <g transform='translate(280, 140)'>
    <rect width='75' height='26' rx='8' fill='#1e293b' stroke='#10B981' stroke-width='1'/>
    <text x='37' y='17' fill='#10B981' font-family='sans-serif' font-size='10' font-weight='bold' text-anchor='middle'>Compose</text>
  </g>
  <g transform='translate(60, 160)'>
    <rect width='72' height='26' rx='8' fill='#1e293b' stroke='#38bdf8' stroke-width='1'/>
    <text x='36' y='17' fill='#38bdf8' font-family='sans-serif' font-size='10' font-weight='bold' text-anchor='middle'>Flutter</text>
  </g>
</svg>